name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The production build, as Vercel runs it: prerendering catches what
      # lint and types don't (a client hook reading the URL outside Suspense
      # broke a deploy in #245). Placeholder values; nothing is fetched.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # The pgTAP tests in supabase/tests/database: RLS, the database functions,
  # and what each band can see. They run against a local Supabase (Docker on
  # the runner) with every migration applied, never the hosted project, and
  # need no secrets.
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # The Supabase CLI version pinned in package-lock.json.
      - uses: supabase/setup-cli@v2
      # Just the database, auth, and storage the migrations build on.
      - run: supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
